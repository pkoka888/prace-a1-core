<!doctype html>
<html lang="cs" data-site="prace-v-nemecku">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Připravujeme portál Práce v Německu.">
  <title>Práce v Německu</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; color: #f8fafc; }
    main { width: min(760px, calc(100% - 2rem)); padding: clamp(2rem, 7vw, 5rem); border: 1px solid #1e3a5f; border-radius: 2rem; background: linear-gradient(145deg, #0b1d33, #0b1627); box-shadow: 0 2rem 6rem #0008; }
    p:first-child { color: #60a5fa; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: .5rem 0 1rem; font-size: clamp(2.5rem, 8vw, 5rem); line-height: .95; }
    p { color: #cbd5e1; font-size: clamp(1rem, 2.5vw, 1.25rem); line-height: 1.65; }
    .status { display: inline-flex; align-items: center; gap: .6rem; margin-top: 1.5rem; color: #93c5fd; }
    .status::before { content: ""; width: .65rem; height: .65rem; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 1rem #38bdf8; }
  </style>
</head>
<body>
  <main>
    <p>Tvoje.info</p>
    <h1>Práce v Německu</h1>
    <p>Připravujeme bezpečný portál pro pracovníky a partnery. Veřejná stránka bude postupně doplněna o ověřené informace a kontaktní možnosti.</p>
    <p class="status">Web je v přípravě</p>
  </main>
</body>
</html>
