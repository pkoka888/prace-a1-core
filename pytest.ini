[pytest]
pythonpath = .
testpaths = tests
norecursedirs = .git .pytest_cache __pycache__ archive build dist fixtures node_modules output private venv .venv .kilo
addopts =
    -q
    --tb=short
    --timeout=300
    -n auto
    --dist=loadfile

markers =
    serial: tests that must run alone (real gunicorn, browser, lifecycle)
    smoke: fast HTTP/boot checks
    integration: full-stack tests with real services
    unit: isolated unit tests (default)
    flaky: known-flaky tests excluded from standard CI
