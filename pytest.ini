[pytest]
pythonpath = .
testpaths = tests
norecursedirs = .git .pytest_cache __pycache__ archive build dist fixtures node_modules output private venv .venv .kilo
addopts =
    -q
    --tb=short

markers =
    serial: identifies process-owning tests; metadata only, not a scheduler or lock
    smoke: fast HTTP/boot checks
    integration: full-stack tests with real services
    unit: identifies isolated unit tests; unmarked tests are not assigned automatically
    flaky: identifies known instability; does not skip or exclude tests
