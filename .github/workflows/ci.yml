name: CI

on:
  push:
    branches: [main, master, feat/**]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC (slow tests)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Fast tests: run on every PR and push
  fast-tests:
    name: Fast Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pip install -r requirements-lock.txt

      - name: Run fast tests
        run: |
          venv/bin/python -m pytest -q --ignore=tests/m2 --ignore=tests/architecture \
            -x -v
        continue-on-error: false

  # Lint check: run on every PR and push
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m venv venv
          # Pinned to the same ruff the pre-commit hook uses (v0.8.0). An
          # unpinned ruff resolves to a newer release whose default rule set is
          # broader, so the hook and CI would disagree about what passes.
          venv/bin/pip install "ruff==0.8.0" pytest

      - name: Run ruff
        run: |
          venv/bin/ruff check . --output-format=github
        continue-on-error: false

      - name: Check tracked credential signatures
        run: venv/bin/python scripts/check_git_content.py

  # Slow tests: run on schedule and main push only
  slow-tests:
    name: Slow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      - name: Run all tests
        run: |
          venv/bin/python -m pytest -q --tb=short
        continue-on-error: false
