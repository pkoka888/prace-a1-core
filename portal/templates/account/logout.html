{% extends "portal/base.html" %}
{% load i18n %}

{% block title %}Odhlášení | Práce v Německu{% endblock %}

{% block content %}
<section class="max-w-md mx-auto py-8" aria-labelledby="logout-heading">
    <div class="bg-white shadow rounded-lg p-6 sm:p-8">
        <h2 id="logout-heading" class="text-2xl font-semibold text-gray-900">Odhlášení</h2>
        <p class="mt-2 text-sm text-gray-600">Opravdu se chcete odhlásit?</p>
        <form method="post" action="{% url 'account_logout' %}" class="mt-6 flex gap-3">
            {% csrf_token %}{{ redirect_field }}
            <button type="submit" class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">Odhlásit se</button>
            <a href="{% url 'dashboard' %}" class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Zpět</a>
        </form>
    </div>
</section>
{% endblock %}
