{% extends "portal/base.html" %}

{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-semibold text-gray-900">Vložit text</h2>
    <p class="text-gray-600">Vložte text zkopírovaný z dokumentu nebo napsaný ručně</p>
</div>

<div class="max-w-2xl">
    <div class="bg-white rounded-lg shadow p-6">
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Vložený text</label>
                    <textarea name="pasted_text" rows="12" class="textarea-field font-mono text-sm" placeholder="Vložte text dokumentu..."></textarea>
                </div>
                <p class="text-sm text-gray-500">Vložený text bude zpracován stejným způsobem jako OCR návrhy. Všechny hodnoty vyžadují potvrzení operátorem.</p>
            </div>
            <div class="mt-6 flex gap-4">
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Zpracovat</button>
                <a href="{% url 'intake_wizard' %}" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">Zpět</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
