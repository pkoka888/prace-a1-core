{% extends "portal/base.html" %}

{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-semibold text-gray-900">Přidat pracovníka</h2>
    <p class="text-gray-600">Vyberte způsob přidání nového pracovníka</p>
</div>

<div class="max-w-2xl">
    <div class="bg-white rounded-lg shadow p-6">
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Účel intake</label>
                    {{ form.purpose }}
                </div>
                <fieldset>
                    <legend class="block text-sm font-medium text-gray-700 mb-2">Způsob přidání</legend>
                    <div class="space-y-3">
                        <label class="flex items-start p-4 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="radio" name="intake_type" value="upload" class="mt-1 mr-3" required>
                            <div>
                                <span class="font-medium text-gray-900">Nahrát doklady (OP/ZP)</span>
                                <p class="text-sm text-gray-500">Nahrajte scan OP a/nebo ZP karty. Podporuje PDF, PNG, JPG až do 10 MB na soubor.</p>
                            </div>
                        </label>
                        <label class="flex items-start p-4 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="radio" name="intake_type" value="paste" class="mt-1 mr-3">
                            <div>
                                <span class="font-medium text-gray-900">Vložit text</span>
                                <p class="text-sm text-gray-500">Vložte text zkopírovaný z dokumentu nebo napsaný ručně.</p>
                            </div>
                        </label>
                        <label class="flex items-start p-4 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="radio" name="intake_type" value="manual" class="mt-1 mr-3">
                            <div>
                                <span class="font-medium text-gray-900">Vyplnit ručně</span>
                                <p class="text-sm text-gray-500">Vyplňte údaje o pracovníkovi přímo ve formuláři.</p>
                            </div>
                        </label>
                    </div>
                </fieldset>
            </div>
            <div class="mt-6">
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Pokračovat</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
