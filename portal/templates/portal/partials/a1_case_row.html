<div id="a1-case-row-{{ case.pk }}" class="p-4 border rounded-lg {% if case.readiness == 'blocked' %}bg-red-50 border-red-200{% else %}bg-gray-50 border-gray-200{% endif %}">
    <div class="flex items-center justify-between">
        <div class="flex-1">
            <p class="font-medium text-gray-900">A1 případ #{{ case.pk }} — {{ case.worker.family_name }} {{ case.worker.given_name }}</p>
            <p class="text-sm text-gray-500">Připravenost: {{ case.readiness }} | Externí: {{ case.external_status }}</p>
            <p class="text-xs text-gray-400 font-mono">Source: {{ case.source_hash|truncatechars:16 }}</p>
        </div>
        <a href="{% url 'a1_case_detail' pk=case.pk %}" class="text-blue-600 hover:text-blue-800 text-sm font-medium">Detail</a>
    </div>
</div>
