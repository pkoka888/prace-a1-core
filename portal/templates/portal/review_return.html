{% extends "portal/base.html" %}

{% block title %}Vrátit k úpravě — Release 1A{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="bg-white shadow rounded-lg p-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Vrátit k úpravě</h2>
        <p class="text-gray-600 mb-6">Popište, co je třeba opravit před opětovným schválením.</p>

        <form method="post">
            {% csrf_token %}
            <label for="note" class="block text-sm font-medium text-gray-700 mb-2">Poznámka k úpravě</label>
            <textarea name="note" id="note" rows="5" maxlength="500" required
                      class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                      placeholder="Popište, co je třeba opravit…"></textarea>
            <p class="mt-1 text-xs text-gray-500">Max. 500 znaků.</p>

            <div class="mt-6 flex justify-between">
                <a href="{% url 'review_check_answers' %}"
                   class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                    ← Zpět
                </a>
                <button type="submit"
                        class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700">
                    Potvrdit vrácení
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
