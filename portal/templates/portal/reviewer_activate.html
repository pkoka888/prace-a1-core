{% extends "portal/base.html" %}

{% block title %}Aktivace účtu{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-white rounded-lg shadow p-8">
        <h2 class="text-2xl font-semibold text-gray-900 mb-6 text-center">Aktivace účtu</h2>

        {% if error %}
        <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
            <p class="text-red-700 text-sm">{{ error }}</p>
        </div>
        {% endif %}

        <p class="mb-4 text-sm text-gray-600">
            Nastavte si heslo pro svůj účet. Po přihlášení budete vyzváni k nastavení aplikace pro autentifikaci (TOTP).
        </p>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="password1" class="block text-sm font-medium text-gray-700">Nové heslo</label>
                <input type="password" name="password1" id="password1" required minlength="12"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            </div>

            <div>
                <label for="password2" class="block text-sm font-medium text-gray-700">Heslo znovu</label>
                <input type="password" name="password2" id="password2" required minlength="12"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            </div>

            <div class="pt-4">
                <button type="submit"
                        class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                    Aktivovat účet
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
