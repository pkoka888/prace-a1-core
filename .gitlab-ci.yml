# GitLab CI/CD Configuration — Proposed (Inactive until DEC-016 approval)
# Plan AE / DEC-016: GitLab as secondary backup + CI runner
# GitHub remains authoritative origin; this mirrors and validates only.

# DO NOT ACTIVATE until explicit DEC-016 approval per AGENTS.md
# Activation steps documented in docs/research/2026-08-19-open-decisions-research.md

stages:
  - validate
  - test
  - gate

variables:
  # Full history needed for mirror validation
  GIT_DEPTH: "0"
  # Python version matches project
  PYTHON_VERSION: "3.13"
  # Fail fast on any stage
  CI_FAIL_FAST: "true"

# Default image for all jobs
default:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl >/dev/null
    - python -m venv venv
    - venv/bin/pip install --upgrade pip -q
    - venv/bin/pip install -r requirements.txt -q

# =============================================================================
# STAGE 1: VALIDATE — Governance, Planning, Change Packages
# =============================================================================

validate_planning:
  stage: validate
  script:
    - venv/bin/python scripts/validate_planning.py --json
  artifacts:
    reports:
      junit: validate_planning.xml
    when: always
    expire_in: 7d
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

validate_change_packages:
  stage: validate
  script:
