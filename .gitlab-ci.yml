# =============================================================================
# OPTIONAL: A1 Quality Gate (run on schedule, not every push - slow)
# =============================================================================

a1_quality_gate_render:
  stage: gate
  script:
    - export A1_PRIVATE_DIR="${CI_PROJECT_DIR}"
    - venv/bin/python scripts/a1_quality_gate.py render --json
  timeout: 30m
  artifacts:
    reports:
      junit: a1_qgate_render.xml
    when: always
    expire_in: 7d
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "main" && $CI_PIPELINE_SOURCE == "push"

a1_quality_gate_validate:
  stage: gate
  script:
    - export A1_PRIVATE_DIR="${CI_PROJECT_DIR}"
    - venv/bin/python scripts/a1_quality_gate.py validate --json
  timeout: 30m
  artifacts:
    reports:
      junit: a1_qgate_validate.xml
    when: always
    expire_in: 7d
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_REF_NAME == "main" && $CI_PIPELINE_SOURCE == "push"

# =============================================================================
# MIRROR VALIDATION (runs on GitLab side after mirror sync)
# =============================================================================

mirror_validation:
  stage: validate
  script:
    - echo "Validating GitHub -> GitLab mirror integrity"
    - git fetch github
    - git fetch gitlab
    - DIFF=$(git rev-list --left-right --count github/main...gitlab/main 2>/dev/null || echo "0 0")
    - echo "Mirror diff (behind/ahead): $DIFF"
    - BEHIND=$(echo $DIFF | cut -d' ' -f1)
    - if [ "$BEHIND" -gt 0 ]; then echo "WARNING: GitLab is $BEHIND commits behind GitHub"; exit 1; fi
    - echo "Mirror OK: GitLab up-to-date with GitHub"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  timeout: 10m

